<h2>Olion Ang-kotisivu</h2>
<nav>
  <!--routerLink on Angularin direktiivi. Kertoo selaimelle
että tämä ei ole tavallinen linkki jossa olisi href, vaan
Angularin reitti. Kun routerLink on dynaaminen eli sisältää
muuttujia, joihin vaihtuu arvoja, sen ympärillä pitää olla hakasulut.
page on muuttuja, joka esiintyy routerLinkin arvona olevassa taulukossa.
Dynaamisen reitin kaksi osaa ovat taulukossa pilkulla erotettuna.
-->
  @for (page of content; track $index) {
    <span>
      <a [routerLink]="['/page', page.id]"> {{ page.name }}</a>
    </span>
  }
</nav>
